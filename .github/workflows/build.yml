name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source code
        run: unzip -o src.zip
      - name: Build Ultimate Hack v4
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canPerformGestures="true" android:canRetrieveWindowContent="false" android:notificationTimeout="100" android:description="@string/app_name" />' > app/src/main/res/xml/accessibility_config.xml

          # 1. 全局配置
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/Config.kt
          package com.android.systemhelper
          object Config {
              var espEnable = true
              var aimEnable = false
              var aimSmooth = 1.0f
              var aimFov = 600f
              var authed = false
          }
          EOF

          # 2. 悬浮窗控制台
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/MenuView.kt
          package com.android.systemhelper
          import android.content.Context
          import android.graphics.Color
          import android.view.Gravity
          import android.view.MotionEvent
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView

          class MenuView(context: Context) : LinearLayout(context) {
              init {
                  orientation = VERTICAL
                  setBackgroundColor(Color.parseColor("#80000000"))
                  setPadding(30, 30, 30, 30)

                  val title = TextView(context)
                  title.text = "Hack Menu (Drag)"
                  title.setTextColor(Color.CYAN)
                  addView(title)

                  val btnEsp = Button(context)
                  btnEsp.text = "ESP: ON"
                  btnEsp.setOnClickListener {
                      Config.espEnable = !Config.espEnable
                      btnEsp.text = if (Config.espEnable) "ESP: ON" else "ESP: OFF"
                  }
                  addView(btnEsp)

                  val btnAim = Button(context)
                  btnAim.text = "Aimbot: OFF"
                  btnAim.setOnClickListener {
                      Config.aimEnable = !Config.aimEnable
                      btnAim.text = if (Config.aimEnable) "Aimbot: ON" else "Aimbot: OFF"
                  }
                  addView(btnAim)

                  val tvSmooth = TextView(context)
                  tvSmooth.text = "Aim Smooth: 1.0"
                  tvSmooth.setTextColor(Color.WHITE)
                  addView(tvSmooth)

                  val seekSmooth = SeekBar(context)
                  seekSmooth.max = 50
                  seekSmooth.progress = 10
                  seekSmooth.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          Config.aimSmooth = (progress / 10f).coerceAtLeast(1f)
                          tvSmooth.text = "Aim Smooth: ${Config.aimSmooth}"
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
                  addView(seekSmooth)
              }

              private var initialX = 0
              private var initialY = 0
              private var initialTouchX = 0f
              private var initialTouchY = 0f

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          initialX = this.x.toInt()
                          initialY = this.y.toInt()
                          initialTouchX = event.rawX
                          initialTouchY = event.rawY
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          this.x = initialX + (event.rawX - initialTouchX)
                          this.y = initialY + (event.rawY - initialTouchY)
                          return true
                      }
                  }
                  return super.onTouchEvent(event)
              }
          }
          EOF

          # 3. 无障碍服务
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/HackAccessibilityService.kt
          package com.android.systemhelper
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager

          class HackAccessibilityService : AccessibilityService() {
              private lateinit var wm: WindowManager
              private lateinit var overlay: OverlayView
              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  overlay = OverlayView(this)
                  val lpDraw = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT)
                  wm.addView(overlay, lpDraw)

                  val menu = MenuView(this)
                  val lpMenu = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT)
                  lpMenu.gravity = Gravity.TOP or Gravity.START
                  lpMenu.x = 50
                  lpMenu.y = 200
                  wm.addView(menu, lpMenu)

                  handler.postDelayed(object : Runnable {
                      override fun run() {
                          overlay.invalidate()
                          if (Config.aimEnable) doAimAssist()
                          handler.postDelayed(this, 16L)
                      }
                  }, 16L)
              }

              private fun doAimAssist() {
                  if (!Config.authed || Detector.latest.isEmpty()) return
                  val dm = resources.displayMetrics
                  val cx = dm.widthPixels / 2f
                  val cy = dm.heightPixels / 2f
                  var bestTarget: Detector.Target? = null
                  var minDist = Config.aimFov
                  for (t in Detector.latest) {
                      val tx = t.x + t.w / 2f
                      val ty = t.y + t.h / 2f
                      val dist = Math.hypot((tx - cx).toDouble(), (ty - cy).toDouble()).toFloat()
                      if (dist < minDist) { minDist = dist; bestTarget = t }
                  }
                  bestTarget?.let { target ->
                      val targetX = target.x + target.w / 2f
                      val targetY = target.y + target.h / 3f
                      val dx = (targetX - cx) / Config.aimSmooth
                      val dy = (targetY - cy) / Config.aimSmooth
                      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return
                      val path = Path()
                      path.moveTo(cx, cy)
                      path.lineTo(cx + dx, cy + dy)
                      val gesture = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, 20))
                          .build()
                      dispatchGesture(gesture, null, null)
                  }
              }
              override fun onAccessibilityEvent(event: android.view.accessibility.AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF

          # 4. 画布
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/OverlayView.kt
          package com.android.systemhelper
          import android.content.Context
          import android.graphics.*
          import android.view.View

          class OverlayView(c: Context) : View(c) {
              private val paintBox = Paint().apply { color = 0xFF00FF00.toInt(); style = Paint.Style.STROKE; strokeWidth = 4f }
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (!Config.authed || !Config.espEnable) return
                  for (t in Detector.latest) {
                      canvas.drawRect(t.x.toFloat(), t.y.toFloat(), (t.x + t.w).toFloat(), (t.y + t.h).toFloat(), paintBox)
                  }
              }
          }
          EOF

          # 5. 红血条识别器（全部替换，解决 COLOR_RGBA2HSV 错误）
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/Detector.kt
          package com.android.systemhelper
          import android.graphics.Bitmap
          import org.opencv.android.Utils
          import org.opencv.core.*
          import org.opencv.imgproc.Imgproc
          import java.util.concurrent.Executors

          object Detector {
              data class Target(val x: Int, val y: Int, val w: Int, val h: Int, val health: Int)
              @Volatile var latest: List<Target> = emptyList()
              private val executor = Executors.newSingleThreadExecutor()
              private var busy = false
              private const val SCALE = 0.3f

              fun submit(bmp: Bitmap) {
                  if (busy) return
                  busy = true
                  executor.execute {
                      try {
                          val sw = (bmp.width * SCALE).toInt()
                          val sh = (bmp.height * SCALE).toInt()
                          val scaledBmp = Bitmap.createScaledBitmap(bmp, sw, sh, false)
                          val rgba = Mat(); Utils.bitmapToMat(scaledBmp, rgba)
                          val hsv = Mat(); 
                          // 这里就是正确的 RGB2HSV ！再也不会报错了！
                          Imgproc.cvtColor(rgba, hsv, Imgproc.COLOR_RGB2HSV)
                          
                          val mask1 = Mat(); Core.inRange(hsv, Scalar(0.0, 100.0, 100.0), Scalar(10.0, 255.0, 255.0), mask1)
                          val mask2 = Mat(); Core.inRange(hsv, Scalar(160.0, 100.0, 100.0), Scalar(180.0, 255.0, 255.0), mask2)
                          val mask = Mat(); Core.bitwise_or(mask1, mask2, mask)
                          
                          val contours = ArrayList<MatOfPoint>()
                          Imgproc.findContours(mask, contours, Mat(), Imgproc.RETR_EXTERNAL, Imgproc.CHAIN_APPROX_SIMPLE)
                          
                          val out = ArrayList<Target>()
                          for (c in contours) {
                              val r = Imgproc.boundingRect(c)
                              if (r.width > 10 && r.height > 5 && r.width < 300 && r.height < 200) {
                                  out.add(Target((r.x / SCALE).toInt(), (r.y / SCALE).toInt(), (r.width / SCALE).toInt(), (r.height / SCALE).toInt(), 100))
                              }
                          }
                          latest = out
                      } catch (e: Exception) {
                          e.printStackTrace()
                      } finally {
                          busy = false
                      }
                  }
              }
          }
          EOF

          # 6. 截屏服务
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/ScreenCaptureService.kt
          package com.android.systemhelper
          import android.app.*
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat

          class ScreenCaptureService : Service() {
              private var vd: VirtualDisplay? = null
              private var reader: ImageReader? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  try {
                      createChannel()
                      startForeground(1, getNotif())
                      val resultCode = intent?.getIntExtra("code", 0) ?: 0
                      val data = intent?.getParcelableExtra<Intent>("data") ?: return START_NOT_STICKY
                      val mp = (getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager).getMediaProjection(resultCode, data)
                      val dm = resources.displayMetrics
                      val w = dm.widthPixels
                      val h = dm.heightPixels
                      
                      reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                      vd = mp.createVirtualDisplay("cap", w, h, dm.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, null)
                      
                      reader!!.setOnImageAvailableListener({ r ->
                          val img = r.acquireLatestImage() ?: return@setOnImageAvailableListener
                          try {
                              val buffer = img.planes[0].buffer
                              val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                              bmp.copyPixelsFromBuffer(buffer)
                              Detector.submit(bmp)
                          } catch (e: Exception) {
                              e.printStackTrace()
                          } finally {
                              img.close()
                          }
                      }, Handler(Looper.getMainLooper()))
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  return START_STICKY
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel("1", "SYS", NotificationManager.IMPORTANCE_LOW)
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  }
              }
              private fun getNotif(): Notification {
                  return NotificationCompat.Builder(this, "1").setContentTitle("运行中").setSmallIcon(android.R.drawable.ic_menu_camera).build()
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
