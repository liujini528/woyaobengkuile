name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source code
        run: unzip -o src.zip
      - name: Fix and Force Text Overlay
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canPerformGestures="true" android:canRetrieveWindowContent="false" android:notificationTimeout="100" android:description="@string/app_name" />' > app/src/main/res/xml/accessibility_config.xml
          sed -i 's/COLOR_RGBA2HSV/COLOR_RGB2HSV/g' app/src/main/java/com/android/systemhelper/Detector.kt
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/HackAccessibilityService.kt
          package com.android.systemhelper
          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView

          class HackAccessibilityService : AccessibilityService() {
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  // 强行建一个文本悬浮窗，用来测试会不会闪退
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val textView = TextView(this)
                  textView.text = "测试悬浮窗已启动！"
                  textView.setTextColor(Color.GREEN)
                  textView.textSize = 24f
                  textView.setBackgroundColor(Color.BLACK)

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.LEFT
                  params.x = 100
                  params.y = 200
                  
                  wm.addView(textView, params)
              }
              override fun onAccessibilityEvent(event: android.view.accessibility.AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
