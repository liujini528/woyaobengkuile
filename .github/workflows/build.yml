name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source code
        run: unzip -o src.zip
      - name: Build Recoil Hack
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged" android:accessibilityFeedbackType="feedbackGeneric" android:canPerformGestures="true" android:canRetrieveWindowContent="false" android:notificationTimeout="100" android:description="@string/app_name" />' > app/src/main/res/xml/accessibility_config.xml

          # 1. 全局配置
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/Config.kt
          package com.android.systemhelper
          object Config {
              var recoilEnable = false
              var recoilPower = 15.0f // 压枪力度（像素）
              var authed = false
          }
          EOF

          # 2. 悬浮窗控制台（中文）
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/MenuView.kt
          package com.android.systemhelper
          import android.content.Context
          import android.graphics.Color
          import android.view.Gravity
          import android.view.MotionEvent
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView

          class MenuView(context: Context) : LinearLayout(context) {
              init {
                  orientation = VERTICAL
                  setBackgroundColor(Color.parseColor("#80000000"))
                  setPadding(30, 30, 30, 30)

                  val title = TextView(context)
                  title.text = "压枪控制台"
                  title.setTextColor(Color.CYAN)
                  addView(title)

                  val btnRecoil = Button(context)
                  btnRecoil.text = "压枪: 关"
                  btnRecoil.setOnClickListener {
                      Config.recoilEnable = !Config.recoilEnable
                      btnRecoil.text = if (Config.recoilEnable) "压枪: 开" else "压枪: 关"
                  }
                  addView(btnRecoil)

                  val tvPower = TextView(context)
                  tvPower.text = "力度: 15"
                  tvPower.setTextColor(Color.WHITE)
                  addView(tvPower)

                  val seekPower = SeekBar(context)
                  seekPower.max = 40
                  seekPower.progress = 15
                  seekPower.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          Config.recoilPower = progress.toFloat()
                          tvPower.text = "力度: $progress"
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
                  addView(seekPower)
              }

              private var initialX = 0
              private var initialY = 0
              private var initialTouchX = 0f
              private var initialTouchY = 0f

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          initialX = this.x.toInt()
                          initialY = this.y.toInt()
                          initialTouchX = event.rawX
                          initialTouchY = event.rawY
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          this.x = initialX + (event.rawX - initialTouchX)
                          this.y = initialY + (event.rawY - initialTouchY)
                          return true
                      }
                  }
                  return super.onTouchEvent(event)
              }
          }
          EOF

          # 3. 无障碍服务（核心压枪逻辑：监听屏幕触摸）
          cat << 'EOF' > app/src/main/java/com/android/systemhelper/HackAccessibilityService.kt
          package com.android.systemhelper
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent

          class HackAccessibilityService : AccessibilityService() {
              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())
              private var isShooting = false

              override fun onServiceConnected() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val menu = MenuView(this)
                  val lpMenu = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT)
                  lpMenu.gravity = Gravity.TOP or Gravity.START
                  lpMenu.x = 50
                  lpMenu.y = 200
                  wm.addView(menu, lpMenu)
                  
                  // 核心压枪循环
                  handler.postDelayed(object : Runnable {
                      override fun run() {
                          if (Config.recoilEnable && isShooting) {
                              doRecoil()
                          }
                          handler.postDelayed(this, 30L)
                      }
                  }, 30L)
              }

              private fun doRecoil() {
                  val dm = resources.displayMetrics
                  val cx = dm.widthPixels / 2f
                  val cy = dm.heightPixels / 2f

                  // 模拟手指向下微滑
                  val path = Path()
                  path.moveTo(cx, cy)
                  path.lineTo(cx, cy + Config.recoilPower)

                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 20))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              // 监听屏幕上的触摸事件，判断是否按住开火键
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      // 实际实战中，用 TYPE_VIEW_SCROLLED 或者触摸监听判定玩家是否在射击
                  }
              }
              override fun onInterrupt() {}
          }
          EOF

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
