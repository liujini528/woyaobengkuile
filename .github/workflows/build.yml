name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source code
        run: unzip -o src.zip
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix gradlew and force execute
        run: |
          # 强制修复 Windows 换行符，并给所有权限
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ls -l gradlew
      - name: Build APK
        run: |
          # 直接调用 bash 执行
          bash ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
